<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>홀짝 서바이벌</title>

<style>

/* ===============================
   기본
================================ */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;

    font-family:
        "Malgun Gothic",
        Arial,
        sans-serif;

    background: #f4f7fb;

    overflow-x: hidden;
    overflow-y: auto;

    -webkit-overflow-scrolling: touch;
}


/* 게임 중에는 화면 고정 */

body.game-active {
    height: 100vh;
    overflow: hidden;
}


/* ===============================
   시작 화면
================================ */

#setup {

    width: 100%;

    min-height: 100vh;

    padding:
        max(25px, env(safe-area-inset-top))
        15px
        max(40px, env(safe-area-inset-bottom));

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}


#setup h1 {

    font-size: clamp(
        34px,
        7vw,
        52px
    );

    margin: 5px 0 10px;
}


#setup p {

    font-size: clamp(
        16px,
        3.5vw,
        21px
    );

    line-height: 1.5;

    margin: 5px 0 10px;
}


.option-title {

    margin-top: 20px;

    margin-bottom: 9px;

    font-size: clamp(
        19px,
        4vw,
        24px
    );

    font-weight: 900;
}


/* ===============================
   설정 버튼
================================ */

.option-buttons {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 9px;

    width: min(
        750px,
        100%
    );
}


.setupBtn {

    min-width: 82px;

    min-height: 54px;

    padding: 8px 15px;

    border: none;

    border-radius: 12px;

    background: white;

    color: #222;

    font-size: 19px;

    font-weight: 900;

    box-shadow:
        0 3px 8px
        rgba(0,0,0,0.16);

    cursor: pointer;

    touch-action: manipulation;
}


.setupBtn.selected {

    background: #3f51b5;

    color: white;
}


#startBtn {

    margin-top: 30px;

    min-width: 220px;

    min-height: 65px;

    padding: 14px 40px;

    border: none;

    border-radius: 15px;

    background: #ff9800;

    color: white;

    font-size: 26px;

    font-weight: 900;

    cursor: pointer;

    touch-action: manipulation;
}


/* ===============================
   게임
================================ */

#game {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100dvh;

    min-height: 100vh;

    background: #222;

    overflow: hidden;
}


/* ===============================
   전체 게임 시간
================================ */

#globalTimer {

    position: absolute;

    top:
        max(
            5px,
            env(safe-area-inset-top)
        );

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 50;

    min-width: 110px;

    padding: 6px 13px;

    border-radius: 13px;

    background:
        rgba(
            0,
            0,
            0,
            0.85
        );

    color: white;

    text-align: center;

    font-size: clamp(
        18px,
        2.2vw,
        32px
    );

    font-weight: 900;

    pointer-events: none;
}


#globalTimer.danger {

    background: #d32f2f;
}


/* ===============================
   플레이어 전체 영역
================================ */

#players {

    width: 100%;

    height: 100%;

    display: flex;

    flex-direction: row;

    align-items: stretch;

    gap: 3px;

    background: #222;
}


/* ===============================
   개별 플레이어
================================ */

.player {

    flex: 1 1 0;

    min-width: 0;

    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    position: relative;

    overflow: hidden;

    border-right:
        2px solid #444;
}


.player:last-child {
    border-right: 0;
}


/* 선수별 색상 */

.player:nth-child(1) {
    background: #fff8e1;
}

.player:nth-child(2) {
    background: #e3f2fd;
}

.player:nth-child(3) {
    background: #f3e5f5;
}

.player:nth-child(4) {
    background: #e8f5e9;
}

.player:nth-child(5) {
    background: #fce4ec;
}


/* ===============================
   선수 번호
================================ */

.player-name {

    flex: 0 0 auto;

    width: 100%;

    padding:
        max(
            8px,
            env(safe-area-inset-top)
        )
        2px
        5px;

    text-align: center;

    font-size: clamp(
        13px,
        1.7vw,
        25px
    );

    font-weight: 900;

    background:
        rgba(
            255,
            255,
            255,
            0.55
        );
}


/* ===============================
   점수
================================ */

.score {

    flex: 0 0 auto;

    margin-top: 6px;

    font-size: clamp(
        14px,
        1.6vw,
        24px
    );

    font-weight: 900;
}


.score-number {

    color: #1565c0;

    font-size: 1.5em;
}


/* ===============================
   숫자
================================ */

.number {

    flex: 1 1 auto;

    width: 100%;

    min-height: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: clamp(
        48px,
        8vw,
        145px
    );

    font-weight: 900;

    line-height: 1;
}


/* ===============================
   문제별 타이머
================================ */

.timerText {

    flex: 0 0 auto;

    margin-bottom: 4px;

    font-size: clamp(
        13px,
        1.5vw,
        22px
    );

    font-weight: 900;
}


.timerBox {

    flex: 0 0 auto;

    width: 84%;

    height: 15px;

    margin-bottom: 8px;

    background: #bbb;

    border-radius: 20px;

    overflow: hidden;
}


.timerBar {

    width: 100%;

    height: 100%;

    background: #4caf50;
}


.noLimitText {

    flex: 0 0 auto;

    margin-bottom: 10px;

    font-size: clamp(
        12px,
        1.4vw,
        20px
    );

    font-weight: 900;

    color: #555;
}


/* ===============================
   하단 답 버튼
================================ */

.answer-buttons {

    flex: 0 0 auto;

    width: 100%;

    display: flex;

    gap: 3px;

    padding:
        0
        4px
        max(
            7px,
            env(safe-area-inset-bottom)
        );
}


.answerBtn {

    flex: 1 1 0;

    min-width: 0;

    height: clamp(
        95px,
        22vh,
        165px
    );

    border: none;

    border-radius: 11px;

    color: white;

    font-size: clamp(
        20px,
        2.8vw,
        42px
    );

    font-weight: 900;

    cursor: pointer;

    /*
      동시에 여러 학생이
      터치할 수 있도록 설정
    */

    touch-action: none;

    -webkit-tap-highlight-color:
        transparent;

    box-shadow:
        inset
        0
        -5px
        0
        rgba(0,0,0,0.15);
}


.answerBtn.pressed {

    transform: scale(0.95);

    filter: brightness(0.85);
}


.oddBtn {

    background: #2196f3;
}


.evenBtn {

    background: #e91e63;
}


/* ===============================
   정답 효과
================================ */

.correctFlash {

    animation:
        correctFlash
        0.23s;
}


@keyframes correctFlash {

    0% {
        background: #69f0ae;
    }
}


/* ===============================
   탈락
================================ */

.player.eliminated {

    background: #333 !important;

    color: white;
}


.game-over {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-size: clamp(
        22px,
        3vw,
        55px
    );

    color: #ff5252;

    font-weight: 900;
}


.reason {

    padding: 0 3px;

    text-align: center;

    font-size: clamp(
        11px,
        1.3vw,
        20px
    );
}


.final-score {

    padding-bottom: 25px;

    font-size: clamp(
        17px,
        2vw,
        30px
    );

    font-weight: 900;
}


/* ===============================
   전체 시간 종료
================================ */

.player.time-finished {

    background: #263238 !important;

    color: white;
}


.time-finished-title {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    font-size: clamp(
        22px,
        3vw,
        50px
    );

    color: #ffeb3b;

    font-weight: 900;
}


/* ===============================
   최종 결과
================================ */

#resultScreen {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    padding: 20px;

    background:
        rgba(
            0,
            0,
            0,
            0.93
        );

    color: white;

    overflow-y: auto;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


#resultScreen h1 {

    margin: 5px;

    font-size: clamp(
        34px,
        6vw,
        50px
    );
}


#ranking {

    width:
        min(
            650px,
            95%
        );
}


.rank-row {

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    gap: 15px;

    margin: 7px;

    padding: 12px 18px;

    border-radius: 12px;

    background: white;

    color: #222;

    font-size: clamp(
        18px,
        3vw,
        24px
    );
}


.rank1 {

    background: #fff176;

    font-weight: 900;
}


#restartBtn {

    margin-top: 15px;

    min-height: 58px;

    padding: 12px 35px;

    border: none;

    border-radius: 12px;

    background: #ff9800;

    color: white;

    font-size: 22px;

    font-weight: 900;

    cursor: pointer;

    touch-action: manipulation;
}


/* ===============================
   모바일 세로 화면
================================ */

@media
(max-width: 700px)
and
(orientation: portrait) {

    #setup {
        justify-content: flex-start;
    }

    #setup h1 {
        margin-top: 15px;
    }

}


/* ===============================
   높이가 낮은 화면
================================ */

@media
(max-height: 650px) {

    .player-name {

        padding-top: 5px;

        padding-bottom: 3px;
    }

    .score {

        margin-top: 2px;
    }

    .number {

        font-size: clamp(
            42px,
            7vw,
            100px
        );
    }

    .timerBox {

        height: 11px;

        margin-bottom: 5px;
    }

    .answerBtn {

        height: clamp(
            80px,
            25vh,
            115px
        );
    }

}

</style>
</head>


<body>


<!-- ==============================
     시작 화면
=============================== -->

<div id="setup">

    <h1>
        🔥 홀짝 서바이벌 🔥
    </h1>

    <p>
        숫자를 보고 홀수 또는 짝수를 눌러라!<br>
        틀리거나 제한 시간을 넘으면 탈락!
    </p>


    <!-- 참가 인원 -->

    <div class="option-title">
        👥 참가 인원
    </div>


    <div class="option-buttons">

        <button
        class="setupBtn countBtn"
        data-count="1">
            1명
        </button>

        <button
        class="setupBtn countBtn"
        data-count="2">
            2명
        </button>

        <button
        class="setupBtn countBtn"
        data-count="3">
            3명
        </button>

        <button
        class="setupBtn countBtn"
        data-count="4">
            4명
        </button>

        <button
        class="setupBtn countBtn selected"
        data-count="5">
            5명
        </button>

    </div>



    <!-- 한 문제 제한 시간 -->

    <div class="option-title">
        ⏱️ 한 문제 제한 시간
    </div>


    <div class="option-buttons">

        <button
        class="setupBtn questionTimeBtn selected"
        data-time="3000">
            3초
        </button>

        <button
        class="setupBtn questionTimeBtn"
        data-time="5000">
            5초
        </button>

        <button
        class="setupBtn questionTimeBtn"
        data-time="10000">
            10초
        </button>

        <button
        class="setupBtn questionTimeBtn"
        data-time="0">
            제한 없음
        </button>

    </div>



    <!-- 전체 문제풀이 시간 -->

    <div class="option-title">
        ⏳ 전체 문제풀이 시간
    </div>


    <div class="option-buttons">

        <button
        class="setupBtn totalTimeBtn"
        data-time="30000">
            30초
        </button>

        <button
        class="setupBtn totalTimeBtn selected"
        data-time="60000">
            1분
        </button>

        <button
        class="setupBtn totalTimeBtn"
        data-time="120000">
            2분
        </button>

        <button
        class="setupBtn totalTimeBtn"
        data-time="180000">
            3분
        </button>

    </div>



    <button id="startBtn">
        게임 시작
    </button>

</div>



<!-- ==============================
     게임 화면
=============================== -->

<div id="game">

    <div id="globalTimer">
        ⏳ 1:00
    </div>


    <div id="players"></div>

</div>



<!-- ==============================
     결과 화면
=============================== -->

<div id="resultScreen">

    <h1>
        🏆 최종 결과 🏆
    </h1>


    <div id="ranking"></div>


    <button id="restartBtn">
        다시 하기
    </button>

</div>



<script>

/* =====================================
   기본 설정
===================================== */

/* 한 문제 기본 시간 = 3초 */

let QUESTION_TIME = 3000;


/* 전체 게임 기본 시간 = 1분 */

let TOTAL_TIME = 60000;


/* 기본 인원 = 5명 */

let playerCount = 5;


let players = [];

let gameFinished = false;

let resultShown = false;


let globalTimerInterval = null;

let globalStartTime = 0;



/* =====================================
   선택 버튼 처리
===================================== */

function selectButton(
    button,
    selector
) {

    document
    .querySelectorAll(selector)
    .forEach(btn => {

        btn.classList.remove(
            "selected"
        );

    });


    button.classList.add(
        "selected"
    );

}



/* =====================================
   참가 인원 선택
===================================== */

document
.querySelectorAll(".countBtn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            selectButton(
                button,
                ".countBtn"
            );


            playerCount =
                Number(
                    button.dataset.count
                );

        }
    );

});



/* =====================================
   한 문제 제한 시간
===================================== */

document
.querySelectorAll(
    ".questionTimeBtn"
)
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            selectButton(
                button,
                ".questionTimeBtn"
            );


            QUESTION_TIME =
                Number(
                    button.dataset.time
                );

        }
    );

});



/* =====================================
   전체 문제풀이 시간
===================================== */

document
.querySelectorAll(
    ".totalTimeBtn"
)
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            selectButton(
                button,
                ".totalTimeBtn"
            );


            TOTAL_TIME =
                Number(
                    button.dataset.time
                );

        }
    );

});



/* =====================================
   게임 시작
===================================== */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    startGame
);


function startGame() {

    players = [];

    gameFinished = false;

    resultShown = false;


    for(
        let i = 0;
        i < playerCount;
        i++
    ) {

        players.push({

            id: i,

            name:
                `${i + 1}번`,

            score: 0,

            number: 0,

            alive: true,

            accepting: false,

            questionTimer: null,

            questionStartTime: 0

        });

    }


    /* 게임 중에는 페이지 고정 */

    document.body
    .classList.add(
        "game-active"
    );


    document
    .getElementById("setup")
    .style.display =
        "none";


    document
    .getElementById("game")
    .style.display =
        "block";


    /* 이전 경고 색 제거 */

    document
    .getElementById("globalTimer")
    .classList.remove(
        "danger"
    );


    createPlayerAreas();


    startGlobalTimer();


    /*
       모든 학생이 각각
       동시에 게임 시작
    */

    players.forEach(
        player => {

            nextQuestion(
                player.id
            );

        }
    );

}



/* =====================================
   플레이어 화면 생성
===================================== */

function createPlayerAreas() {

    const area =

        document
        .getElementById(
            "players"
        );


    area.innerHTML = "";


    players.forEach(
        player => {


            const div =

                document
                .createElement(
                    "div"
                );


            div.className =
                "player";


            div.id =
                `player-${player.id}`;



            let timerHTML = "";


            if(
                QUESTION_TIME === 0
            ) {

                timerHTML = `

                    <div
                    class="noLimitText">

                        ⏱ 제한 없음

                    </div>

                `;

            }

            else {

                timerHTML = `

                    <div
                    class="timerText"
                    id="timerText-${player.id}">

                        ${
                            (
                                QUESTION_TIME
                                /
                                1000
                            )
                            .toFixed(1)
                        }초

                    </div>


                    <div
                    class="timerBox">

                        <div
                        class="timerBar"
                        id="timerBar-${player.id}">
                        </div>

                    </div>

                `;

            }



            div.innerHTML = `

                <div
                class="player-name">

                    ${player.name}

                </div>


                <div
                class="score">

                    정답

                    <span
                    class="score-number"
                    id="score-${player.id}">

                        0

                    </span>

                    개

                </div>


                <div
                class="number"
                id="number-${player.id}">

                    ?

                </div>


                ${timerHTML}


                <div
                class="answer-buttons">


                    <button
                    class="answerBtn oddBtn"
                    data-player="${player.id}"
                    data-choice="odd">

                        홀수

                    </button>


                    <button
                    class="answerBtn evenBtn"
                    data-player="${player.id}"
                    data-choice="even">

                        짝수

                    </button>


                </div>

            `;


            area.appendChild(
                div
            );

        }
    );


    /*
       멀티터치 이벤트 연결
    */

    bindAnswerButtons();

}



/* =====================================
   멀티터치 입력
===================================== */

function bindAnswerButtons() {

    const buttons =

        document
        .querySelectorAll(
            ".answerBtn"
        );


    buttons.forEach(
        button => {


            button.addEventListener(
                "pointerdown",
                function(event) {


                    /*
                       브라우저 기본 터치 동작 차단
                    */

                    event.preventDefault();


                    /*
                       각 손가락을
                       독립적으로 처리
                    */

                    try {

                        this.setPointerCapture(
                            event.pointerId
                        );

                    }

                    catch(e) {}


                    this.classList.add(
                        "pressed"
                    );


                    const id =

                        Number(
                            this.dataset.player
                        );


                    const choice =

                        this.dataset.choice;


                    /*
                       손가락이 닿는 순간
                       바로 판정
                    */

                    answer(
                        id,
                        choice
                    );

                },

                {
                    passive: false
                }

            );



            const release =
                function() {

                    this.classList.remove(
                        "pressed"
                    );

                };


            button.addEventListener(
                "pointerup",
                release
            );


            button.addEventListener(
                "pointercancel",
                release
            );


            button.addEventListener(
                "lostpointercapture",
                release
            );


        }
    );

}



/* =====================================
   새 문제
===================================== */

function nextQuestion(id) {

    if(gameFinished) {

        return;

    }


    const player =
        players[id];


    if(!player.alive) {

        return;

    }


    clearInterval(
        player.questionTimer
    );


    /*
       1 ~ 99 랜덤 숫자
    */

    player.number =

        Math.floor(
            Math.random() * 99
        ) + 1;


    player.accepting =
        true;


    const numberElement =

        document
        .getElementById(
            `number-${id}`
        );


    if(numberElement) {

        numberElement.innerText =
            player.number;

    }


    /*
       문제 제한 시간이
       있을 때만 타이머 시작
    */

    if(
        QUESTION_TIME > 0
    ) {

        startQuestionTimer(id);

    }

}



/* =====================================
   문제별 타이머
===================================== */

function startQuestionTimer(id) {

    const player =
        players[id];


    player.questionStartTime =
        performance.now();


    const timerBar =

        document
        .getElementById(
            `timerBar-${id}`
        );


    const timerText =

        document
        .getElementById(
            `timerText-${id}`
        );


    if(
        !timerBar ||
        !timerText
    ) {

        return;

    }


    timerBar.style.width =
        "100%";


    timerBar.style.background =
        "#4caf50";


    timerText.innerText =

        (
            QUESTION_TIME
            /
            1000
        )
        .toFixed(1)
        +
        "초";


    player.questionTimer =

        setInterval(
            () => {


                if(
                    gameFinished ||
                    !player.alive ||
                    !player.accepting
                ) {

                    clearInterval(
                        player.questionTimer
                    );

                    return;

                }


                const elapsed =

                    performance.now()
                    -
                    player.questionStartTime;


                const remaining =

                    Math.max(

                        0,

                        QUESTION_TIME
                        -
                        elapsed

                    );


                const percent =

                    remaining
                    /
                    QUESTION_TIME
                    *
                    100;


                timerBar.style.width =

                    percent + "%";


                timerText.innerText =

                    (
                        remaining
                        /
                        1000
                    )
                    .toFixed(1)
                    +
                    "초";


                /*
                   타이머 색 변화
                */

                if(
                    percent <= 30
                ) {

                    timerBar
                    .style
                    .background =
                        "#f44336";

                }

                else if(
                    percent <= 60
                ) {

                    timerBar
                    .style
                    .background =
                        "#ff9800";

                }

                else {

                    timerBar
                    .style
                    .background =
                        "#4caf50";

                }


                if(
                    remaining <= 0
                ) {

                    clearInterval(
                        player.questionTimer
                    );


                    timeOver(id);

                }


            },

            25

        );

}



/* =====================================
   답 선택
===================================== */

function answer(
    id,
    choice
) {

    if(gameFinished) {

        return;

    }


    const player =
        players[id];


    if(
        !player ||
        !player.alive ||
        !player.accepting
    ) {

        return;

    }


    /*
       동시에 두 버튼을 눌러도
       첫 번째 입력만 인정
    */

    player.accepting =
        false;


    clearInterval(
        player.questionTimer
    );


    const correctChoice =

        player.number % 2 === 0

        ? "even"

        : "odd";


    if(
        choice === correctChoice
    ) {

        correct(id);

    }

    else {

        eliminate(
            id,
            "❌ 틀렸어요!"
        );

    }

}



/* =====================================
   정답
===================================== */

function correct(id) {

    const player =
        players[id];


    if(
        gameFinished ||
        !player.alive
    ) {

        return;

    }


    player.score++;


    const scoreElement =

        document
        .getElementById(
            `score-${id}`
        );


    if(scoreElement) {

        scoreElement.innerText =
            player.score;

    }


    const playerArea =

        document
        .getElementById(
            `player-${id}`
        );


    /*
       초록색 정답 효과
    */

    if(playerArea) {

        playerArea
        .classList
        .add(
            "correctFlash"
        );


        setTimeout(
            () => {

                playerArea
                ?.classList
                .remove(
                    "correctFlash"
                );

            },

            200
        );

    }


    /*
       해당 학생만
       바로 다음 문제
    */

    setTimeout(
        () => {

            if(
                !gameFinished &&
                player.alive
            ) {

                nextQuestion(id);

            }

        },

        120
    );

}



/* =====================================
   문제 시간 초과
===================================== */

function timeOver(id) {

    if(gameFinished) {

        return;

    }


    const player =
        players[id];


    if(
        !player ||
        !player.alive ||
        !player.accepting
    ) {

        return;

    }


    player.accepting =
        false;


    eliminate(
        id,
        "⏰ 시간 초과!"
    );

}



/* =====================================
   탈락
===================================== */

function eliminate(
    id,
    reason
) {

    if(gameFinished) {

        return;

    }


    const player =
        players[id];


    if(
        !player ||
        !player.alive
    ) {

        return;

    }


    player.alive =
        false;


    player.accepting =
        false;


    clearInterval(
        player.questionTimer
    );


    const area =

        document
        .getElementById(
            `player-${id}`
        );


    if(area) {

        area.className =
            "player eliminated";


        area.innerHTML = `

            <div
            class="player-name">

                ${player.name}

            </div>


            <div
            class="game-over">

                탈락!

            </div>


            <div
            class="reason">

                ${reason}

            </div>


            <div
            class="final-score">

                정답
                ${player.score}개

            </div>

        `;

    }


    checkAllEliminated();

}



/* =====================================
   전체 게임 타이머 시작
===================================== */

function startGlobalTimer() {

    globalStartTime =
        performance.now();


    updateGlobalTimerDisplay(
        TOTAL_TIME
    );


    globalTimerInterval =

        setInterval(
            () => {


                if(gameFinished) {

                    clearInterval(
                        globalTimerInterval
                    );

                    return;

                }


                const elapsed =

                    performance.now()
                    -
                    globalStartTime;


                const remaining =

                    Math.max(

                        0,

                        TOTAL_TIME
                        -
                        elapsed

                    );


                updateGlobalTimerDisplay(
                    remaining
                );


                const display =

                    document
                    .getElementById(
                        "globalTimer"
                    );


                /*
                   마지막 10초 빨간색
                */

                if(
                    remaining <= 10000
                ) {

                    display
                    .classList
                    .add(
                        "danger"
                    );

                }


                if(
                    remaining <= 0
                ) {

                    clearInterval(
                        globalTimerInterval
                    );


                    finishByTotalTime();

                }


            },

            50

        );

}



/* =====================================
   전체 남은 시간 표시
===================================== */

function updateGlobalTimerDisplay(
    milliseconds
) {

    const totalSeconds =

        Math.ceil(
            milliseconds
            /
            1000
        );


    const minutes =

        Math.floor(
            totalSeconds / 60
        );


    const seconds =

        totalSeconds % 60;


    document
    .getElementById(
        "globalTimer"
    )
    .innerText =

        "⏳ "
        +
        minutes
        +
        ":"
        +
        String(seconds)
        .padStart(2, "0");

}



/* =====================================
   전체 시간 종료
===================================== */

function finishByTotalTime() {

    if(gameFinished) {

        return;

    }


    gameFinished = true;


    document
    .getElementById(
        "globalTimer"
    )
    .innerText =
        "⏰ 종료!";


    players.forEach(
        player => {


            clearInterval(
                player.questionTimer
            );


            player.accepting =
                false;


            /*
               살아 있는 학생은
               시간 종료 화면 표시
            */

            if(player.alive) {

                const area =

                    document
                    .getElementById(
                        `player-${player.id}`
                    );


                if(area) {

                    area.className =
                        "player time-finished";


                    area.innerHTML = `

                        <div
                        class="player-name">

                            ${player.name}

                        </div>


                        <div
                        class="time-finished-title">

                            ⏰ 시간 종료!

                        </div>


                        <div
                        class="final-score">

                            정답
                            ${player.score}개

                        </div>

                    `;

                }

            }


        }
    );


    setTimeout(
        showResult,
        900
    );

}



/* =====================================
   모든 학생 탈락 확인
===================================== */

function checkAllEliminated() {

    const aliveCount =

        players.filter(
            player =>
                player.alive
        ).length;


    if(
        aliveCount === 0 &&
        !gameFinished
    ) {

        gameFinished = true;


        clearInterval(
            globalTimerInterval
        );


        setTimeout(
            showResult,
            700
        );

    }

}



/* =====================================
   최종 순위
===================================== */

function showResult() {

    if(resultShown) {

        return;

    }


    resultShown = true;

    gameFinished = true;


    clearInterval(
        globalTimerInterval
    );


    players.forEach(
        player => {

            clearInterval(
                player.questionTimer
            );

        }
    );


    /*
       점수 높은 순서
    */

    const ranking =

        [...players]
        .sort(
            (a, b) =>
                b.score - a.score
        );


    const rankingArea =

        document
        .getElementById(
            "ranking"
        );


    rankingArea.innerHTML = "";


    let rank = 1;


    ranking.forEach(
        (
            player,
            index
        ) => {


            /*
               동점 처리
            */

            if(
                index > 0 &&
                player.score
                <
                ranking[index - 1].score
            ) {

                rank =
                    index + 1;

            }


            let medal = "";


            if(rank === 1) {

                medal = "🥇";

            }

            else if(rank === 2) {

                medal = "🥈";

            }

            else if(rank === 3) {

                medal = "🥉";

            }


            const row =

                document
                .createElement(
                    "div"
                );


            row.className =
                "rank-row";


            if(rank === 1) {

                row.classList.add(
                    "rank1"
                );

            }


            row.innerHTML = `

                <span>

                    ${medal}
                    ${rank}위
                    ${player.name}

                </span>


                <strong>

                    ${player.score}개

                </strong>

            `;


            rankingArea
            .appendChild(row);

        }
    );


    document
    .getElementById(
        "resultScreen"
    )
    .style.display =
        "flex";

}



/* =====================================
   다시 하기
===================================== */

document
.getElementById(
    "restartBtn"
)
.addEventListener(
    "click",
    () => {

        document.body
        .classList.remove(
            "game-active"
        );


        location.reload();

    }
);

</script>
