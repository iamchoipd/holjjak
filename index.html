<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>홀짝 서바이벌</title>

<style>

/* ==================================================
   기본
================================================== */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    margin: 0;
    width: 100%;
    min-height: 100vh;

    font-family:
        "Malgun Gothic",
        Arial,
        sans-serif;

    background: #f4f7fb;

    overflow-x: hidden;
    overflow-y: auto;

    -webkit-overflow-scrolling: touch;
}

body.game-active {
    height: 100vh;
    overflow: hidden;
}


/* ==================================================
   시작 화면
================================================== */

#setup {

    width: 100%;
    min-height: 100vh;

    padding:
        max(25px, env(safe-area-inset-top))
        18px
        max(40px, env(safe-area-inset-bottom));

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;
}


#setup h1 {

    margin: 5px 0 10px;

    font-size: clamp(
        34px,
        7vw,
        54px
    );
}


#setup p {

    margin: 5px 0 20px;

    font-size: clamp(
        16px,
        3.5vw,
        21px
    );

    line-height: 1.6;
}


/* ==================================================
   설정 상자
================================================== */

#settingsBox {

    width: min(520px, 100%);

    padding: 22px;

    background: white;

    border-radius: 22px;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.12);
}


.setting-row {

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    width: 100%;

    margin-bottom: 16px;
}


.setting-row:last-child {

    margin-bottom: 0;
}


.setting-label {

    flex: 1;

    text-align: left;

    font-size: clamp(
        17px,
        3.4vw,
        21px
    );

    font-weight: 900;
}


/* ==================================================
   펼침 선택
================================================== */

.setting-select {

    width: 185px;
    min-height: 55px;

    padding: 8px 13px;

    border:
        3px solid #3f51b5;

    border-radius: 13px;

    background: white;

    color: #222;

    font-size: 19px;

    font-weight: 900;

    cursor: pointer;

    touch-action: manipulation;
}


.setting-select:focus {

    outline: none;

    box-shadow:
        0 0 0 4px
        rgba(63,81,181,0.18);
}


/* ==================================================
   시작 버튼
================================================== */

#startBtn {

    margin-top: 25px;

    min-width: 230px;
    min-height: 68px;

    padding: 14px 45px;

    border: none;
    border-radius: 16px;

    background: #ff9800;

    color: white;

    font-size: 27px;

    font-weight: 900;

    cursor: pointer;

    touch-action: manipulation;

    box-shadow:
        0 5px 10px
        rgba(0,0,0,0.2);
}


#startBtn:active {

    transform: scale(0.96);
}


/* ==================================================
   게임
================================================== */

#game {

    display: none;

    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100dvh;

    min-height: 100vh;

    background: #222;

    overflow: hidden;
}


/* ==================================================
   시작 카운트다운
================================================== */

#countdownOverlay {

    display: none;

    position: absolute;
    inset: 0;

    z-index: 500;

    background:
        rgba(0,0,0,0.78);

    align-items: center;
    justify-content: center;

    color: white;

    pointer-events: all;
}


#countdownNumber {

    font-size: clamp(
        120px,
        24vw,
        300px
    );

    font-weight: 900;

    line-height: 1;

    text-shadow:
        0 8px 25px
        rgba(0,0,0,0.5);
}


.countdown-pop {

    animation:
        countdownPop
        0.75s ease-out;
}


@keyframes countdownPop {

    0% {
        transform: scale(0.35);
        opacity: 0;
    }

    35% {
        transform: scale(1.25);
        opacity: 1;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }

}


/* ==================================================
   전체 타이머
================================================== */

#globalTimer {

    position: absolute;

    top:
        max(
            5px,
            env(safe-area-inset-top)
        );

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 50;

    min-width: 110px;

    padding: 6px 13px;

    border-radius: 13px;

    background:
        rgba(0,0,0,0.85);

    color: white;

    text-align: center;

    font-size: clamp(
        18px,
        2.2vw,
        32px
    );

    font-weight: 900;

    pointer-events: none;
}


#globalTimer.danger {

    background: #d32f2f;

    animation:
        globalDanger
        0.55s
        infinite
        alternate;
}


@keyframes globalDanger {

    from {

        transform:
            translateX(-50%)
            scale(1);
    }

    to {

        transform:
            translateX(-50%)
            scale(1.07);
    }

}


/* ==================================================
   플레이어 전체
================================================== */

#players {

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: row;

    align-items: stretch;

    gap: 3px;

    background: #222;
}


/* ==================================================
   플레이어
================================================== */

.player {

    flex: 1 1 0;

    min-width: 0;

    height: 100%;

    position: relative;

    display: flex;
    flex-direction: column;

    align-items: center;

    overflow: hidden;

    border-right:
        2px solid #444;
}


.player:last-child {

    border-right: 0;
}


.player:nth-child(1) {
    background: #fff8e1;
}

.player:nth-child(2) {
    background: #e3f2fd;
}

.player:nth-child(3) {
    background: #f3e5f5;
}

.player:nth-child(4) {
    background: #e8f5e9;
}

.player:nth-child(5) {
    background: #fce4ec;
}


/* ==================================================
   선수 번호
================================================== */

.player-name {

    flex: 0 0 auto;

    width: 100%;

    padding:
        max(
            8px,
            env(safe-area-inset-top)
        )
        2px
        5px;

    text-align: center;

    font-size: clamp(
        13px,
        1.7vw,
        25px
    );

    font-weight: 900;

    background:
        rgba(255,255,255,0.55);
}


/* ==================================================
   점수
================================================== */

.score {

    flex: 0 0 auto;

    margin-top: 5px;

    font-size: clamp(
        13px,
        1.5vw,
        23px
    );

    font-weight: 900;
}


.score-number {

    color: #1565c0;

    font-size: 1.45em;
}


/* ==================================================
   하트
================================================== */

.hearts {

    flex: 0 0 auto;

    min-height: 30px;

    margin-top: 3px;

    font-size: clamp(
        18px,
        2vw,
        31px
    );

    line-height: 1;

    letter-spacing: 1px;
}


/* ==================================================
   문제 숫자
================================================== */

.number {

    flex: 1 1 auto;

    width: 100%;
    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: clamp(
        48px,
        8vw,
        145px
    );

    font-weight: 900;

    line-height: 1;
}


/* ==================================================
   상태 메시지
================================================== */

.status-message {

    flex: 0 0 auto;

    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0 3px;

    text-align: center;

    font-size: clamp(
        11px,
        1.25vw,
        18px
    );

    font-weight: 900;
}


.status-correct {
    color: #2e7d32;
}


.status-wrong {
    color: #d32f2f;
}


/* ==================================================
   문제 타이머
================================================== */

.timerText {

    flex: 0 0 auto;

    margin-bottom: 4px;

    font-size: clamp(
        13px,
        1.5vw,
        22px
    );

    font-weight: 900;
}


.timerBox {

    flex: 0 0 auto;

    width: 84%;
    height: 15px;

    margin-bottom: 8px;

    background: #bbb;

    border-radius: 20px;

    overflow: hidden;
}


.timerBar {

    width: 100%;
    height: 100%;

    background: #4caf50;
}


.noLimitText {

    flex: 0 0 auto;

    margin-bottom: 10px;

    font-size: clamp(
        12px,
        1.4vw,
        20px
    );

    font-weight: 900;

    color: #555;
}


/* ==================================================
   답 버튼
================================================== */

.answer-buttons {

    flex: 0 0 auto;

    width: 100%;

    display: flex;

    gap: 3px;

    padding:
        0
        4px
        max(
            7px,
            env(safe-area-inset-bottom)
        );
}


.answerBtn {

    flex: 1 1 0;

    min-width: 0;

    height: clamp(
        95px,
        22vh,
        165px
    );

    border: none;

    border-radius: 11px;

    color: white;

    font-size: clamp(
        20px,
        2.8vw,
        42px
    );

    font-weight: 900;

    cursor: pointer;

    touch-action: none;

    -webkit-tap-highlight-color:
        transparent;

    box-shadow:
        inset
        0
        -5px
        0
        rgba(0,0,0,0.15);
}


.answerBtn.pressed {

    transform: scale(0.95);

    filter: brightness(0.82);
}


.oddBtn {
    background: #2196f3;
}


.evenBtn {
    background: #e91e63;
}


/* ==================================================
   정답 효과
================================================== */

.correctFlash {

    animation:
        correctFlash
        0.23s;
}


@keyframes correctFlash {

    0% {
        background: #69f0ae;
    }

}


/* ==================================================
   오답 3초 정지
================================================== */

.penalty-overlay {

    display: none;

    position: absolute;
    inset: 0;

    z-index: 100;

    background:
        rgba(180,0,0,0.9);

    color: white;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    pointer-events: all;
}


.penalty-title {

    font-size: clamp(
        22px,
        3vw,
        48px
    );

    font-weight: 900;

    margin-bottom: 8px;
}


.penalty-count {

    font-size: clamp(
        65px,
        9vw,
        150px
    );

    font-weight: 900;

    line-height: 1;
}


.penalty-sub {

    margin-top: 10px;

    font-size: clamp(
        12px,
        1.5vw,
        22px
    );

    font-weight: 900;
}


/* ==================================================
   탈락
================================================== */

.player.eliminated {

    background: #333 !important;

    color: white;
}


.game-over {

    flex: 1;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: clamp(
        22px,
        3vw,
        55px
    );

    color: #ff5252;

    font-weight: 900;
}


.reason {

    padding: 0 3px;

    text-align: center;

    font-size: clamp(
        11px,
        1.3vw,
        20px
    );
}


.final-score {

    padding-bottom: 25px;

    font-size: clamp(
        17px,
        2vw,
        30px
    );

    font-weight: 900;
}


/* ==================================================
   전체 시간 종료
================================================== */

.player.time-finished {

    background: #263238 !important;

    color: white;
}


.time-finished-title {

    flex: 1;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: clamp(
        22px,
        3vw,
        50px
    );

    color: #ffeb3b;

    font-weight: 900;
}


/* ==================================================
   결과 화면
================================================== */

#resultScreen {

    display: none;

    position: fixed;
    inset: 0;

    z-index: 1000;

    padding: 20px;

    background:
        rgba(0,0,0,0.93);

    color: white;

    overflow-y: auto;

    flex-direction: column;

    align-items: center;
    justify-content: center;
}


#resultScreen h1 {

    margin: 5px;

    font-size: clamp(
        34px,
        6vw,
        50px
    );
}


#ranking {

    width:
        min(
            650px,
            95%
        );
}


.rank-row {

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 15px;

    margin: 7px;

    padding: 12px 18px;

    border-radius: 12px;

    background: white;

    color: #222;

    font-size: clamp(
        18px,
        3vw,
        24px
    );
}


.rank1 {

    background: #fff176;

    font-weight: 900;
}


#restartBtn {

    margin-top: 15px;

    min-height: 58px;

    padding: 12px 35px;

    border: none;
    border-radius: 12px;

    background: #ff9800;

    color: white;

    font-size: 22px;

    font-weight: 900;

    cursor: pointer;

    touch-action: manipulation;
}


/* ==================================================
   모바일 세로
================================================== */

@media
(max-width: 700px)
and
(orientation: portrait) {

    #setup {
        justify-content: flex-start;
    }

    #setup h1 {
        margin-top: 15px;
    }

    .setting-row {

        flex-direction: column;

        align-items: stretch;

        gap: 7px;
    }

    .setting-label {
        text-align: center;
    }

    .setting-select {
        width: 100%;
    }

}


/* ==================================================
   낮은 화면
================================================== */

@media
(max-height: 650px) {

    .player-name {
        padding-top: 5px;
        padding-bottom: 3px;
    }

    .score {
        margin-top: 2px;
    }

    .hearts {

        min-height: 22px;

        font-size: clamp(
            15px,
            1.7vw,
            24px
        );
    }

    .status-message {
        height: 20px;
    }

    .number {

        font-size: clamp(
            42px,
            7vw,
            100px
        );
    }

    .timerBox {
        height: 11px;
        margin-bottom: 5px;
    }

    .answerBtn {

        height: clamp(
            80px,
            25vh,
            115px
        );
    }

}

</style>
</head>


<body>


<!-- ==================================================
     시작 화면
================================================== -->

<div id="setup">

    <h1>
        🔥 홀짝 서바이벌 🔥
    </h1>

    <p>
        숫자를 보고 홀수 또는 짝수를 눌러라!<br>
        틀리면 하트가 하나 줄어듭니다.
    </p>


    <div id="settingsBox">


        <!-- 참가 인원 -->

        <div class="setting-row">

            <div class="setting-label">
                👥 참가 인원
            </div>


            <select
            id="playerCountSelect"
            class="setting-select">

                <option
                value="1"
                selected>
                    1명
                </option>

                <option value="2">
                    2명
                </option>

                <option value="3">
                    3명
                </option>

                <option value="4">
                    4명
                </option>

                <option value="5">
                    5명
                </option>

            </select>

        </div>



        <!-- 문제 제한 시간 -->

        <div class="setting-row">

            <div class="setting-label">
                ⏱️ 한 문제 제한 시간
            </div>


            <select
            id="questionTimeSelect"
            class="setting-select">

                <option value="3000">
                    3초
                </option>

                <option value="5000">
                    5초
                </option>

                <option value="10000">
                    10초
                </option>

                <option
                value="0"
                selected>
                    제한 없음
                </option>

            </select>

        </div>



        <!-- 전체 문제풀이 시간 -->

        <div class="setting-row">

            <div class="setting-label">
                ⏳ 전체 문제풀이 시간
            </div>


            <select
            id="totalTimeSelect"
            class="setting-select">

                <option
                value="30000"
                selected>
                    30초
                </option>

                <option value="60000">
                    1분
                </option>

                <option value="120000">
                    2분
                </option>

                <option value="180000">
                    3분
                </option>

            </select>

        </div>



        <!-- 하트 -->

        <div class="setting-row">

            <div class="setting-label">
                ❤️ 하트
            </div>


            <select
            id="heartsSelect"
            class="setting-select">

                <option
                value="1"
                selected>
                    ❤️ 1개
                </option>

                <option value="2">
                    ❤️❤️ 2개
                </option>

                <option value="3">
                    ❤️❤️❤️ 3개
                </option>

            </select>

        </div>


    </div>


    <button id="startBtn">
        🔊 게임 시작
    </button>

</div>



<!-- ==================================================
     게임
================================================== -->

<div id="game">


    <div id="countdownOverlay">

        <div id="countdownNumber">
            3
        </div>

    </div>



    <div id="globalTimer">
        ⏳ 0:30
    </div>



    <div id="players"></div>


</div>



<!-- ==================================================
     결과
================================================== -->

<div id="resultScreen">

    <h1>
        🏆 최종 결과 🏆
    </h1>


    <div id="ranking"></div>


    <button id="restartBtn">
        다시 하기
    </button>

</div>



<script>

/* ==================================================
   기본 설정

   기본값
   1명
   문제 제한 없음
   전체 30초
   하트 1개
================================================== */

let playerCount = 1;

let QUESTION_TIME = 0;

let TOTAL_TIME = 30000;

let MAX_HEARTS = 1;


const WRONG_PENALTY_TIME =
    3000;


let players = [];

let gameFinished = false;

let resultShown = false;


let globalTimerInterval = null;

let globalStartTime = 0;

let countdownInterval = null;


/* ==================================================
   소리 설정
================================================== */

let audioContext = null;


/*
   오디오 기능 활성화

   모바일 브라우저에서는
   사용자가 버튼을 직접 누른 순간
   AudioContext를 활성화해야
   이후 소리가 정상적으로 납니다.
*/

function initAudio() {

    try {

        const AudioContextClass =

            window.AudioContext
            ||
            window.webkitAudioContext;


        if(!AudioContextClass) {

            return;

        }


        if(!audioContext) {

            audioContext =
                new AudioContextClass();

        }


        if(
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }


        /*
           아주 작은 무음에 가까운 소리로
           모바일 오디오를 활성화
        */

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        gain.gain.value =
            0.00001;


        oscillator.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime
            +
            0.02
        );

    }

    catch(error) {

        console.log(
            "오디오 활성화 실패",
            error
        );

    }

}



/* ==================================================
   카운트다운 비프음
================================================== */

function playCountdownBeep() {

    if(!audioContext) {

        return;

    }


    try {

        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency
        .setValueAtTime(
            520,
            now
        );


        gain.gain
        .setValueAtTime(
            0.0001,
            now
        );


        gain.gain
        .exponentialRampToValueAtTime(
            0.22,
            now + 0.015
        );


        gain.gain
        .exponentialRampToValueAtTime(
            0.0001,
            now + 0.20
        );


        oscillator.connect(
            gain
        );


        gain.connect(
            audioContext.destination
        );


        oscillator.start(
            now
        );


        oscillator.stop(
            now + 0.22
        );

    }

    catch(error) {

        console.log(
            "카운트다운 소리 오류",
            error
        );

    }

}



/* ==================================================
   실제 시작음
================================================== */

function playStartSound() {

    if(!audioContext) {

        return;

    }


    try {

        const now =
            audioContext.currentTime;


        /*
           첫 번째 음
        */

        createStartTone(
            660,
            now,
            0.16
        );


        /*
           두 번째 높은 음
        */

        createStartTone(
            880,
            now + 0.15,
            0.32
        );

    }

    catch(error) {

        console.log(
            "시작음 오류",
            error
        );

    }

/* ==================================================
   시작음 개별 음 생성
================================================== */

function createStartTone(
    frequency,
    startTime,
    duration
) {

    const oscillator =
        audioContext
        .createOscillator();


    const gain =
        audioContext
        .createGain();


    oscillator.type =
        "sine";


    oscillator.frequency
    .setValueAtTime(
        frequency,
        startTime
    );


    gain.gain
    .setValueAtTime(
        0.0001,
        startTime
    );


    gain.gain
    .exponentialRampToValueAtTime(
        0.28,
        startTime + 0.015
    );


    gain.gain
    .exponentialRampToValueAtTime(
        0.0001,
        startTime + duration
    );


    oscillator.connect(
        gain
    );


    gain.connect(
        audioContext.destination
    );


    oscillator.start(
        startTime
    );


    oscillator.stop(
        startTime + duration + 0.02
    );

}

    );


    /*
       3 표시와 동시에 소리
    */

    playCountdownBeep();



    countdownInterval =

        setInterval(
            () => {


                count--;


                if(
                    count > 0
                ) {


                    showCountdownNumber(
                        number,
                        count
                    );


                    /*
                       2, 1 비프음

                    );

                        null;

                        "none";


                    /*

                    playStartSound();


                    beginActualGame();

                }


            },

            1000

        );

}

function getHeartText(
    hearts
) {


    if(
        hearts <= 0
    ) {

        return "💔";

    }


    return "❤️".repeat(
        hearts
    );

/* ==================================================
   멀티터치
================================================== */

function bindAnswerButtons() {


    const buttons =

        document
        .querySelectorAll(
            ".answerBtn"
        );



    buttons
    .forEach(
        button => {


            button
            .addEventListener(
                "pointerdown",
                function(event) {


                    event
                    .preventDefault();



                    try {


                        this
                        .setPointerCapture(
                            event.pointerId
                        );


                    }

                    catch(error) {}



                    this
                    .classList
                    .add(
                        "pressed"
                    );



                    const id =

                        Number(
                            this.dataset.player
                        );


                    const choice =

                        this.dataset.choice;



                    answer(
                        id,
                        choice
                    );


                },

                {
                    passive: false
                }

            );



            const release =
                function() {


                    this
                    .classList
                    .remove(
                        "pressed"
                    );


                };



            button
            .addEventListener(
                "pointerup",
                release
            );


            button
            .addEventListener(
                "pointercancel",
                release
            );


            button
            .addEventListener(
                "lostpointercapture",
                release
            );


        }
    );

}



/* ==================================================

================================================== */

function nextQuestion(id) {


    if(
        gameFinished
    ) {

        return;

    }



    const player =
        players[id];



    if(
        !player ||
        !player.alive ||
        player.paused
    ) {

        return;

    }



    clearInterval(
        player.questionTimer
    );


    clearTimeout(
        player.transitionTimer
    );



    player.number =

        Math.floor(
            Math.random() * 99
        ) + 1;



    player.accepting =
        true;



    const numberElement =

        document
        .getElementById(
            `number-${id}`
        );



    if(
        numberElement
    ) {


        numberElement
        .innerText =
            player.number;


    }



    const status =

        document
        .getElementById(
            `status-${id}`
        );



    if(
        status
    ) {


        status
        .innerText =
            "";


        status
        .className =
            "status-message";


    }



    if(
        QUESTION_TIME > 0
    ) {


        startQuestionTimer(
            id
        );


    }

}



/* ==================================================
   문제 제한 시간
================================================== */

function startQuestionTimer(id) {


    const player =
        players[id];



    player.questionStartTime =
        performance.now();



    const timerBar =

        document
        .getElementById(
            `timerBar-${id}`
        );



    const timerText =

        document
        .getElementById(
            `timerText-${id}`
        );



    if(
        !timerBar ||
        !timerText
    ) {

        return;

    }



    timerBar
    .style
    .width =
        "100%";


    timerBar
    .style
    .background =
        "#4caf50";



    timerText
    .innerText =

        (
            QUESTION_TIME
            /
            1000
        )
        .toFixed(1)
        +
        "초";



    player.questionTimer =

        setInterval(
            () => {


                if(
                    gameFinished ||
                    !player.alive ||
                    !player.accepting ||
                    player.paused
                ) {


                    clearInterval(
                        player.questionTimer
                    );


                    return;

                }



                const elapsed =

                    performance.now()
                    -
                    player.questionStartTime;



                const remaining =

                    Math.max(

                        0,

                        QUESTION_TIME
                        -
                        elapsed

                    );



                const percent =

                    remaining
                    /
                    QUESTION_TIME
                    *
                    100;



                timerBar
                .style
                .width =

                    percent
                    +
                    "%";



                timerText
                .innerText =

                    (
                        remaining
                        /
                        1000
                    )
                    .toFixed(1)
                    +
                    "초";



                if(
                    percent <= 30
                ) {


                    timerBar
                    .style
                    .background =
                        "#f44336";


                }

                else if(
                    percent <= 60
                ) {


                    timerBar
                    .style
                    .background =
                        "#ff9800";


                }

                else {


                    timerBar
                    .style
                    .background =
                        "#4caf50";


                }



                if(
                    remaining <= 0
                ) {


                    clearInterval(
                        player.questionTimer
                    );


                    timeFailed(
                        id
                    );


                }


            },

            25

        );

}



/* ==================================================
   답 선택
================================================== */

function answer(
    id,
    choice
) {


    if(
        gameFinished
    ) {

        return;

    }



    const player =
        players[id];



    if(
        !player ||
        !player.alive ||
        !player.accepting ||
        player.paused
    ) {

        return;

    }



    player.accepting =
        false;



    clearInterval(
        player.questionTimer
    );



    const correctChoice =

        player.number % 2 === 0

        ? "even"

        : "odd";



    if(
        choice ===
        correctChoice
    ) {


        correct(
            id
        );


    }

    else {


        wrongAnswer(
            id
        );


    }

}



/* ==================================================
   정답
================================================== */

function correct(id) {


    const player =
        players[id];



    if(
        gameFinished ||
        !player.alive
    ) {

        return;

    }



    player.score++;



    const scoreElement =

        document
        .getElementById(
            `score-${id}`
        );



    if(
        scoreElement
    ) {


        scoreElement
        .innerText =
            player.score;


    }



    const status =

        document
        .getElementById(
            `status-${id}`
        );



    if(
        status
    ) {


        status
        .innerText =
            "⭕ 정답!";


        status
        .className =
            "status-message status-correct";


    }



    const playerArea =

        document
        .getElementById(
            `player-${id}`
        );



    if(
        playerArea
    ) {


        playerArea
        .classList
        .add(
            "correctFlash"
        );



        setTimeout(
            () => {


                playerArea
                ?.classList
                .remove(
                    "correctFlash"
                );


            },

            180
        );


    }



    player.transitionTimer =

        setTimeout(
            () => {


                if(
                    !gameFinished &&
                    player.alive &&
                    !player.paused
                ) {


                    nextQuestion(
                        id
                    );


                }


            },

            180
        );

}



/* ==================================================
   오답
================================================== */

function wrongAnswer(id) {


    if(
        gameFinished
    ) {

        return;

    }



    const player =
        players[id];



    if(
        !player ||
        !player.alive
    ) {

        return;

    }



    player.accepting =
        false;



    clearInterval(
        player.questionTimer
    );



    player.hearts--;



    if(
        player.hearts < 0
    ) {


        player.hearts =
            0;


    }



    updateHearts(
        id
    );



    /*
       마지막 하트가 없어지면
       바로 탈락
    */

    if(
        player.hearts <= 0
    ) {


        eliminate(
            id,
            "❌ 틀렸어요!"
        );


        return;

    }



    /*
       하트가 남은 경우에만
       3초 페널티
    */

    startWrongPenalty(
        id
    );

}



/* ==================================================
   오답 3초 정지
================================================== */

function startWrongPenalty(id) {


    const player =
        players[id];



    if(
        !player ||
        !player.alive ||
        gameFinished
    ) {

        return;

    }



    player.paused =
        true;


    player.accepting =
        false;



    const overlay =

        document
        .getElementById(
            `penalty-${id}`
        );



    const countElement =

        document
        .getElementById(
            `penaltyCount-${id}`
        );



    if(
        !overlay
    ) {

        return;

    }



    overlay
    .style
    .display =
        "flex";



    let remainingCount =
        3;



    countElement
    .innerText =
        remainingCount;



    player.penaltyInterval =

        setInterval(
            () => {


                remainingCount--;



                if(
                    remainingCount > 0
                ) {


                    if(
                        countElement
                    ) {


                        countElement
                        .innerText =
                            remainingCount;


                    }


                }


            },

            1000

        );



    player.penaltyTimeout =

        setTimeout(
            () => {


                clearInterval(
                    player.penaltyInterval
                );



                player.penaltyInterval =
                    null;


                player.penaltyTimeout =
                    null;



                if(
                    gameFinished
                ) {

                    return;

                }



                if(
                    overlay
                ) {


                    overlay
                    .style
                    .display =
                        "none";


                }



                player.paused =
                    false;



                if(
                    player.alive
                ) {


                    nextQuestion(
                        id
                    );


                }


            },

            WRONG_PENALTY_TIME

        );

}

================================================== */

function startGlobalTimer() {


    globalStartTime =
        performance.now();



    updateGlobalTimerDisplay(
        TOTAL_TIME
    );



    globalTimerInterval =

        setInterval(
            () => {


                if(
                    gameFinished
                ) {


                    clearInterval(
                        globalTimerInterval
                    );


                    return;

                }



                const elapsed =

                    performance.now()
                    -
                    globalStartTime;



                const remaining =

                    Math.max(

                        0,

                        TOTAL_TIME
                        -
                        elapsed

                    );



                updateGlobalTimerDisplay(
                    remaining
                );



                const display =

                    document
                    .getElementById(
                        "globalTimer"
                    );



                if(
                    remaining <= 10000
                ) {


                    display
                    .classList
                    .add(
                        "danger"
                    );


                }



                if(
                    remaining <= 0
                ) {


                    clearInterval(
                        globalTimerInterval
                    );


                    finishByTotalTime();


                }


            },

            50

        );

}



/* ==================================================
   전체 시간 표시
================================================== */

function updateGlobalTimerDisplay(
    milliseconds
) {


    const totalSeconds =

        Math.ceil(
            milliseconds
            /
            1000
        );



    const minutes =

        Math.floor(
            totalSeconds
            /
            60
        );



    const seconds =

        totalSeconds
        %
        60;



    document
    .getElementById(
        "globalTimer"
    )
    .innerText =

        "⏳ "
        +
        minutes
        +
        ":"
        +
        String(seconds)
        .padStart(
            2,
            "0"
        );

}



/* ==================================================
   전체 시간 종료
================================================== */

function finishByTotalTime() {


    if(
        gameFinished
    ) {

        return;

    }



    gameFinished =
        true;



    const globalTimer =

        document
        .getElementById(
            "globalTimer"

    .innerText =

    .classList

    );



    players

            clearInterval(
                player.questionTimer
            );


            clearInterval(
                player.penaltyInterval
            );


            clearTimeout(
                player.penaltyTimeout
            );


            clearTimeout(
                player.transitionTimer
            );



            player.accepting =
                false;


            player.paused =
                false;



            if(
                player.alive
            ) {


                const area =

                    document
                    .getElementById(
                        `player-${player.id}`
                    );



                if(
                    area
                ) {


                    area
                    .className =
                        "player time-finished";



                    area
                    .innerHTML = `


                        <div
                        class="player-name">

                            ${player.name}

                        </div>


                        <div
                        style="
                            font-size:28px;
                            padding-top:15px;
                        ">

                            ${
                                getHeartText(
                                    player.hearts
                                )
                            }

                        </div>


                        <div
                        class="time-finished-title">

                            ⏰ 시간 종료!

                        </div>


                        <div
                        class="final-score">

                            정답
                            ${player.score}개

                        </div>


                    `;


                }


            }


        }
    );



    setTimeout(
        showResult,
        900
    );

}



/* ==================================================
   전원 탈락
================================================== */

function checkAllEliminated() {


    const aliveCount =

        players
        .filter(
            player =>
                player.alive
        )
        .length;



    if(
        aliveCount === 0 &&
        !gameFinished
    ) {


        gameFinished =
            true;



        clearInterval(
            globalTimerInterval
        );



        setTimeout(
            showResult,
            500
        );


    }

}



/* ==================================================
   결과
================================================== */

function showResult() {


    if(
        resultShown
    ) {

        return;

    }



    resultShown =
        true;


    gameFinished =
        true;



    clearInterval(
        globalTimerInterval
    );



    if(
        countdownInterval
    ) {


        clearInterval(
            countdownInterval
        );


    }



    players
    .forEach(
        player => {


            clearInterval(
                player.questionTimer
            );


            clearInterval(
                player.penaltyInterval
            );


            clearTimeout(
                player.penaltyTimeout
            );


            clearTimeout(
                player.transitionTimer
            );


        }
    );



    const ranking =

        [...players]
        .sort(
            (a, b) => {


                if(
                    b.score !==
                    a.score
                ) {


                    return (
                        b.score -
                        a.score
                    );


                }


                return (
                    b.hearts -
                    a.hearts
                );


            }
        );



    const rankingArea =

        document
        .getElementById(
            "ranking"
        );



    rankingArea
    .innerHTML =
        "";



    let rank =
        1;



    ranking
    .forEach(
        (
            player,
            index
        ) => {


            if(
                index > 0
            ) {


                const previous =

                    ranking[
                        index - 1
                    ];



                if(
                    player.score !==
                    previous.score
                    ||
                    player.hearts !==
                    previous.hearts
                ) {


                    rank =
                        index + 1;


                }


            }



            let medal =
                "";



            if(
                rank === 1
            ) {


                medal =
                    "🥇";


            }

            else if(
                rank === 2
            ) {


                medal =
                    "🥈";


            }

            else if(
                rank === 3
            ) {


                medal =
                    "🥉";


            }



            const hearts =

                getHeartText(
                    player.hearts
                );



            const row =

                document
                .createElement(
                    "div"
                );



            row
            .className =
                "rank-row";



            if(
                rank === 1
            ) {


                row
                .classList
                .add(
                    "rank1"
                );


            }



            row
            .innerHTML = `


                <span>

                    ${medal}
                    ${rank}위
                    ${player.name}

                </span>


                <strong>

                    ${player.score}개

                    &nbsp;

                    ${hearts}

                </strong>


            `;



            rankingArea
            .appendChild(
                row
            );


        }
    );



    document
    .getElementById(
        "resultScreen"
    )
    .style
    .display =
        "flex";

}



/* ==================================================
   다시 하기
================================================== */

document
.getElementById(
    "restartBtn"
)
.addEventListener(
    "click",
    () => {


        document
        .body
        .classList
        .remove(
            "game-active"
        );


        location.reload();


    }
);

</script>
